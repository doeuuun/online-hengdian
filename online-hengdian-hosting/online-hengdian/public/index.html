<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="중드 과몰입 체험 공간. 3D 명청궁원을 걷고, 정전에서 인사를 받고, 정자에서 차를 마시고, 소원 등불을 띄워보세요."><meta name="theme-color" content="#1b0f0e"><style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<title>온라인 헝디엔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* Layout: full-bleed side-scrolling canvas world; HUD on top, experience dock at the bottom, intro overlay for the daily role draw. */
:root{
  --ink:#1b0f0e; --ink-2:#2b1816; --vermilion:#b3261e; --gold:#dba94a; --paper:#f3e6cf; --jade:#3e7a6b;
  --font-display:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --font-body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:relative;height:100%;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
#stage{position:absolute;inset:0;touch-action:none;cursor:pointer}
#stage canvas{display:block;width:100%;height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hud{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;
  padding:10px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.brand{font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:.02em;color:var(--paper);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;letter-spacing:.18em;color:var(--gold)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:rgba(27,15,14,.78);border:1px solid rgba(219,169,74,.7);border-radius:6px;padding:7px 12px;font-size:13px;backdrop-filter:blur(4px)}
.btn:hover{background:rgba(60,28,24,.9)}
.btn[aria-pressed="false"]{opacity:.6}
.dock{position:absolute;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-left,0px)) 12px;display:flex;flex-direction:column;gap:8px}
.say{background:var(--paper);color:var(--ink);border:2px solid var(--gold);border-radius:6px;padding:9px 14px;max-width:560px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.say b{font-family:var(--font-display);color:var(--vermilion);margin-right:6px}
.wish{display:flex;gap:8px;max-width:560px}
.wish input{flex:1;min-width:0;background:var(--paper);color:var(--ink);border:2px solid var(--gold);border-radius:6px;padding:9px 12px}
.acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));max-width:820px}
.acts .btn{padding:10px 8px;font-size:14px;text-align:center}
.btn.primary{background:var(--vermilion);border-color:var(--gold);color:#fff}
.btn.primary:hover{background:#c9382f}
.hint{font-size:12px;color:rgba(243,230,207,.75);text-shadow:0 1px 4px rgba(0,0,0,.7)}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 30%,#5a1713 0%,#2a0f0d 55%,#150909 100%);z-index:5}
.card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:left}
.kicker{font-size:12px;letter-spacing:.28em;color:var(--gold)}
.card h1{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,10vw,52px);line-height:1.1;margin:0;text-wrap:balance}
.card p{margin:0;color:rgba(243,230,207,.85);max-width:36ch}
.slot{border:1px solid rgba(219,169,74,.6);border-radius:6px;padding:16px;min-height:112px;background:rgba(0,0,0,.25)}
.slot .q{font-size:12px;letter-spacing:.18em;color:var(--gold)}
.slot .r{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:1.2}
.slot .d{font-size:13px;color:rgba(243,230,207,.8)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sheet{position:absolute;inset:0;z-index:4;background:rgba(10,5,5,.7);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-left,0px))}
.sheet .panel{width:100%;max-width:400px;background:var(--ink-2);border:1px solid var(--gold);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:22px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp{aspect-ratio:1;max-width:100%;border:2px dashed rgba(243,230,207,.3);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(243,230,207,.45);font-size:12px}
.stamp i{font-style:normal;font-family:var(--font-display);font-weight:900;font-size:34px;line-height:1}
.stamp.on{border:2px solid var(--vermilion);background:var(--vermilion);color:#fff6e4;transform:rotate(-3deg)}
.stamp.on:nth-child(even){transform:rotate(3deg)}
@media (max-width:600px){.brand{font-size:15px}.btn{padding:6px 9px;font-size:12px}.acts{grid-template-columns:repeat(3,1fr);gap:6px}.acts .btn{padding:8px 4px;font-size:12.5px}.say{font-size:13px;padding:7px 11px}.dock{padding-bottom:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<div id="app">
  <div id="stage" aria-label="온라인 헝디엔 명청궁원. 바닥을 눌러 이동하고 드래그로 시점을 돌립니다."></div>

  <header class="hud">
    <div class="brand">온라인 헝디엔<small>橫店 · 중드 과몰입 체험 공간</small></div>
    <div class="tools">
      <span class="btn" id="peerChip" role="status">혼자 둘러보는 중</span>
      <button class="btn" id="roleChip" type="button">오늘의 역할</button>
      <button class="btn" id="viewBtn" type="button">전체 보기</button>
      <button class="btn" id="dnBtn" type="button" aria-pressed="true">밤으로</button>
      <button class="btn" id="sndBtn" type="button" aria-pressed="true">소리 켬</button>
      <button class="btn" id="bookBtn" type="button">도장첩 <span id="stampCount">0/6</span></button>
    </div>
  </header>

  <div class="dock">
    <div class="hint" id="hint">바닥을 누르면 걸어가요 · 드래그로 시점 회전 · 휠이나 두 손가락으로 확대</div>
    <div class="say" id="say" hidden></div>
    <form class="wish" id="wishForm" hidden>
      <input id="wishInput" maxlength="16" placeholder="소원을 적어주세요 (16자)" autocomplete="off">
      <button class="btn primary" type="submit">등불 띄우기</button>
    </form>
    <div class="acts">
      <button class="btn" id="hallBtn" type="button" data-act="hall">정전 들어가기</button>
      <button class="btn" id="bowBtn" type="button" data-act="bow">황후에게 문안하기</button>
      <button class="btn" id="teaBtn" type="button" data-act="tea">차 마시기</button>
      <button class="btn" id="wishBtn" type="button" data-act="wish">등불에 소원 적기</button>
      <button class="btn" id="roleActBtn" type="button" data-act="role">역할 행동</button>
      <button class="btn" id="waveBtn" type="button" data-act="wave">손 흔들기</button>
    </div>
  </div>

  <script src="/three.min.js"></script>
  <section class="sheet" id="book" hidden>
    <div class="panel">
      <h2>방문 도장첩</h2>
      <div class="stamps" id="stamps"></div>
      <div id="bookMsg" class="hint"></div>
      <button class="btn" id="bookClose" type="button">닫기</button>
    </div>
  </section>

  <section class="intro" id="intro">
    <div class="card">
      <div class="kicker">橫店 ONLINE</div>
      <h1>온라인 헝디엔</h1>
      <p>명청궁원을 걷고, 정전에 들어가 인사를 받고, 정자에서 차를 마시고, 연못 위로 소원 등불을 띄워보세요. 입장하기 전에 오늘의 나를 뽑습니다.</p>
      <div class="slot" aria-live="polite">
        <div class="q">오늘의 나는</div>
        <div class="r" id="slotName">황후? 황제? 협객?</div>
        <div class="d" id="slotDesc"></div>
      </div>
      <label class="hint" for="nickInput">다른 방문자에게 보일 이름 (선택, 10자)</label>
      <input id="nickInput" maxlength="10" autocomplete="off" placeholder="예: 도은" style="background:var(--paper);color:var(--ink);border:2px solid var(--gold);border-radius:6px;padding:9px 12px;max-width:260px">
      <div class="row">
        <button class="btn primary" id="drawBtn" type="button">오늘의 역할 뽑기</button>
        <button class="btn" id="enterBtn" type="button" hidden>입장하기</button>
      </div>
      <div class="hint" id="visitInfo"></div>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 저장 ---------- */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const save={day:'',days:[],role:null,stamps:[],wishes:[]};
try{Object.assign(save,JSON.parse(localStorage.getItem('onlineHengdian3d')||'{}'))}catch(e){}
function persist(){try{localStorage.setItem('onlineHengdian3d',JSON.stringify(save))}catch(e){}}
if(save.day!==todayStr()){save.day=todayStr();save.stamps=[];save.role=null}
if(!save.days.includes(save.day))save.days.push(save.day);
persist();

/* ---------- 역할 7종 ---------- */
const ROLES={
  empress:{n:'황후',d:'궁에서 가장 높은 여인입니다. 문안을 받고 정전에서 신하들의 예를 받습니다.',col:0xb3263a,trim:0xe0b24f,act:'fan',actLabel:'부채 들기',bowLabel:'상궁의 문안 받기',hall:'"황후마마, 천세, 천세, 천천세!" 신하들이 일제히 허리를 숙입니다.'},
  emperor:{n:'황제',d:'천하의 주인입니다. 정전에 들어서면 모든 신하가 엎드립니다.',col:0xe3b13b,trim:0xb3263a,act:'scroll',actLabel:'칙령 내리기',bowLabel:'황후와 인사 나누기',hall:'"만세, 만세, 만만세!" 신하들의 목소리가 정전에 울립니다.'},
  maid:{n:'궁녀',d:'발소리를 낮추고 쟁반을 든 채 궁을 오갑니다.',col:0xd7869c,trim:0xf3e6cf,act:'tray',actLabel:'쟁반 나르기',bowLabel:'황후에게 문안하기',hall:'신하들이 어리둥절하다가 일단 고개를 숙입니다. 궁녀는 당황해 쟁반을 꼭 쥡니다.'},
  knight:{n:'협객',d:'궁궐 담을 넘어 들어온 떠돌이 검객입니다.',col:0x2d4656,trim:0x9aa7ad,act:'jump',actLabel:'처마로 뛰기',bowLabel:'황후에게 문안하기',hall:'"자객이다!" 하다가 기품에 눌려 다들 슬며시 허리를 숙입니다.'},
  consort:{n:'귀비',d:'황제의 총애를 받는 후궁입니다. 한 걸음마다 비단이 스칩니다.',col:0x7c4a8f,trim:0xf0c36a,act:'fan',actLabel:'비단부채 흔들기',bowLabel:'황후에게 문안하기',hall:'"귀비마마 납시오." 신하들이 눈치껏 정중히 고개를 숙입니다.'},
  eunuch:{n:'태감',d:'황제의 곁을 지키는 환관입니다. 궁의 모든 소문이 귀로 들어옵니다.',col:0x2a5a5a,trim:0xd6b25a,act:'whisk',actLabel:'"납시오" 외치기',bowLabel:'황후에게 아뢰기',hall:'"태감 나리 오셨습니까." 신하들이 슬쩍 눈을 맞추며 인사합니다.'},
  general:{n:'장군',d:'변방에서 돌아온 대장군입니다. 갑옷에서 아직 바람 냄새가 납니다.',col:0x7a1f1f,trim:0xc9ced4,act:'sword',actLabel:'검 뽑기',bowLabel:'황후에게 문안하기',hall:'"장군께서 개선하셨다!" 신하들이 길게 늘어서 예를 올립니다.'}
};
const LINES={
  bow:{
    empress:['상궁이 허리를 깊이 숙입니다. "황후마마, 강녕하시옵니까."','상궁이 낮게 속삭입니다. "오늘 궁원의 햇살이 마마를 닮았사옵니다."'],
    emperor:['황후가 우아하게 예를 올립니다. "폐하, 오셨사옵니까."','황후가 미소 짓습니다. "오늘은 정무가 일찍 끝나셨나 봅니다."'],
    maid:['"황후마마께 문안 올리옵니다." 마마가 고개를 끄덕입니다.','무릎을 굽혀 인사하자 마마가 "일어나게" 하십니다.'],
    knight:['검을 내려놓고 포권을 합니다. 마마가 "무엄하나 용기는 가상하구나" 하십니다.','담을 넘은 사연을 아뢰자 마마가 웃음을 참습니다.'],
    consort:['"언니, 문안 올립니다." 황후가 "동생 왔는가" 하며 찻잔을 내려놓습니다.','귀비가 곱게 절하자 황후의 눈빛이 잠깐 날카로워집니다.'],
    eunuch:['"황후마마께 아뢰옵니다." 허리를 거의 직각으로 숙입니다.','"마마, 궁에 소문이 하나 돌고 있사옵니다." 태감이 목소리를 낮춥니다.'],
    general:['"소장, 황후마마께 인사 올립니다." 한쪽 무릎을 꿇습니다.','황후가 "변방 소식은 어떠한가" 하고 묻습니다.']},
  tea:{
    empress:['찻잔에서 김이 오릅니다. 상궁이 "식기 전에 드시옵소서" 합니다.','한 모금 마시자 국화 향이 번집니다.'],
    emperor:['"짐이 오랜만에 차를 마시는군." 정자에 고요가 내려앉습니다.'],
    maid:['찻물을 따르는 손끝이 떨리지 않게 숨을 고릅니다.','앉아도 되나 싶어 의자 끝에 조심스레 걸터앉습니다.'],
    knight:['객잔 차와는 다른 깊은 향입니다. 검객이 슬며시 미소 짓습니다.','뜨거운 차를 단숨에 마시려다 혀를 델 뻔합니다.'],
    consort:['찻잔을 들고 호수 쪽을 바라봅니다. 오늘은 누구 이야기를 할까요.'],
    eunuch:['앉으라 하셔도 괜히 엉덩이만 반쯤 걸칩니다. 차는 달고 마음은 불편합니다.'],
    general:['투구를 벗어 옆에 두고 차를 마십니다. 오랜만에 어깨의 힘이 빠집니다.']},
  role:{
    empress:['부채를 천천히 펼칩니다. 정자가 조용해집니다.'],
    emperor:['두루마리를 펼쳐 칙령을 내립니다. "들으라!"'],
    maid:['쟁반을 들고 종종걸음으로 오갑니다.'],
    knight:['처마 높이까지 훌쩍 뛰어올랐다 내려앉습니다.'],
    consort:['비단부채를 살랑 흔들자 향이 퍼집니다.'],
    eunuch:['"황제 폐하 납시오~" 목청이 궁원 끝까지 울립니다.'],
    general:['검을 뽑아 하늘을 가리킵니다. 햇빛이 칼날에 번쩍입니다.']},
  throne:{emperor:['옥좌에 앉자 신하들이 다시 한번 고개를 숙입니다.']}
};
const ZONES=[{id:'yard',n:'궁문 앞마당'},{id:'pond',n:'연못 정원'},{id:'hall',n:'정전 안'}];
const STAMPS=[{id:'yard',n:'마당',ch:'庭'},{id:'pond',n:'연못',ch:'池'},{id:'hall',n:'정전',ch:'殿'},{id:'bow',n:'문안',ch:'安'},{id:'tea',n:'차',ch:'茶'},{id:'wish',n:'소원',ch:'願'}];
const SAMPLE_WISHES=[{t:'올해도 무사히',x:-34,z:-84,s:1.2},{t:'정주행 완주하기',x:-8,z:-70,s:3.4},{t:'합격하게 해주세요',x:22,z:-90,s:5.1},{t:'모두 건강하기',x:40,z:-74,s:2.2}];

/* ---------- 낮밤 상태 ---------- */
let night=0,nightTarget=0,sndOn=true,gameOn=false,sayTimer=0;
{const h=new Date().getHours();if(h>=18||h<6){night=nightTarget=1}}
const role=()=>ROLES[save.role||'maid'];

/* ---------- 소리 ---------- */
let AC=null,master=null,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=sndOn?0.9:0;master.connect(AC.destination);
    const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    const wg=AC.createGain();wg.gain.value=0.05;
    const lfo=AC.createOscillator();lfo.frequency.value=0.13;
    const lg=AC.createGain();lg.gain.value=0.03;
    lfo.connect(lg);lg.connect(wg.gain);
    src.connect(lp);lp.connect(wg);wg.connect(master);src.start();lfo.start();
  }catch(e){AC=null}
}
function stepSound(){
  if(!AC||!sndOn)return;
  const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=650+Math.random()*250;
  const gn=AC.createGain();gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(0.16,t+0.012);gn.gain.exponentialRampToValueAtTime(0.0001,t+0.1);

const GX0=-90,GZ0=-108,GW=180,GHH=205,N=GW*GHH;

})();
const cellOf=(x,z)=>{const i=Math.floor(x-GX0),j=Math.floor(z-GZ0);return(i<0||j<0||i>=GW||j>=GHH)?-1:j*GW+i};

  if(c0>=0&&grid[c0])return c0;

  const ci=Math.max(0,Math.min(GW-1,Math.floor(x-GX0))),cj=Math.max(0,Math.min(GHH-1,Math.floor(z-GZ0)));

function initMP(){
  const chip=$('#peerChip');
  chip.textContent='연결 중…';
  const peersMap=new Map();
  let ws=null,retry=0;
  const api={
    peers:()=>[...peersMap.entries()].map(([id,d])=>({peer:id,isMe:false,kind:'viewer',guest:false,presence:d,updatedAt:0})),
    presence:(patch)=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'p',d:patch}));return Promise.resolve()}
  };
  function connect(){
    const proto=location.protocol==='https:'?'wss':'ws';
    try{ws=new WebSocket(proto+'://'+location.host+'/ws')}catch(e){chip.textContent='혼자 둘러보는 중';return}
    ws.onopen=()=>{retry=0;roomApi=api;mpLastSent='';mpChip();mpPush(true)};
    ws.onmessage=ev=>{
      let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.t==='i'){peersMap.clear();(m.peers||[]).forEach(p=>peersMap.set(p[0],p[1]))}
      else if(m.t==='b'){(m.u||[]).forEach(p=>peersMap.set(p[0],p[1]))}
      else if(m.t==='l'){peersMap.delete(m.id)}
      mpChip();
    };
    ws.onclose=()=>{roomApi=null;peersMap.clear();mpClear();chip.textContent='다시 연결 중…';setTimeout(connect,Math.min(10000,1000*Math.pow(2,retry++)))};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  connect();
}

function groundPoint(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const o=ray.ray.origin,d=ray.ray.direction;let y=0,px=0,pz=0;
  for(let k=0;k<4;k++){if(d.y>-1e-3)return null;const t=(y-o.y)/d.y;px=o.x+d.x*t;pz=o.z+d.z*t;y=gh(px,pz)}
  return {x:px,z:pz};
}
function handleTap(cx,cy){
  if(!gameOn)return;
  initAudio();
  const p=groundPoint(cx,cy);if(!p){return}
  $('#wishForm').hidden=true;
  for(const s of SEATS){
    if(Math.hypot(p.x-s.x,p.z-s.z)<(s.throne?3.5:1.4)){
      if(s.throne){if(save.role==='emperor')sitAt(s);else say('옥좌는 황제만 앉을 수 있어요.',null,2600)}else sitAt(s);
      return;
    }
  }
  const rp=mpPeerAt(p.x,p.z);
  if(rp){walkTo(rp.x,rp.z+2.2,()=>{me.face=Math.atan2(rp.x-me.x,rp.z-me.z);startAct('wave');mpWave()});return}
  if(isWater(p.x,p.z)){say('물 위로는 걸을 수 없어요. 다리를 건너보세요.',null,2800);return}
  walkTo(p.x,p.z,null);
}
stage.addEventListener('pointerdown',e=>{
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)tapInfo={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};else{tapInfo=null;pinchD=pDist()}
});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){
    if(tapInfo&&Math.hypot(e.clientX-tapInfo.x,e.clientY-tapInfo.y)>8)tapInfo.moved=true;
    if(!tapInfo||tapInfo.moved){cam3.yaw-=dx*0.006;cam3.pitchT=cam3.pitch=Math.max(0.1,Math.min(1.5,cam3.pitch+dy*0.004))}
  }else if(ptrs.size===2){
    const d=pDist();cam3.distT=Math.max(5,Math.min(150,cam3.distT*pinchD/d));pinchD=d;
  }
});
const endPtr=e=>{
  if(tapInfo&&!tapInfo.moved&&e.type==='pointerup'&&performance.now()-tapInfo.t<600)handleTap(e.clientX,e.clientY);
  ptrs.delete(e.pointerId);tapInfo=null;
};
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{e.preventDefault();cam3.distT=Math.max(5,Math.min(150,cam3.distT*Math.exp(e.deltaY*0.001)))},{passive:false});

/* ========== 매 프레임 ========== */
let last=performance.now();
function update(dt){
  time+=dt;
  if(reduce)night=nightTarget;else night+=Math.sign(nightTarget-night)*Math.min(Math.abs(nightTarget-night),dt*1.1);
  applyLighting(night);
  me.moving=false;
  if(!me.sitting&&me.path.length){
    const w=me.path[0],dx=w.x-me.x,dz=w.z-me.z,d=Math.hypot(dx,dz),sp=8.2*dt;
    if(d<=sp){me.x=w.x;me.z=w.z;me.path.shift();if(!me.path.length){const a=me.pending;me.pending=null;if(a)a()}}
    else{
      me.x+=dx/d*sp;me.z+=dz/d*sp;me.moving=true;me.phase+=dt*11;me.face=turn(me.face,Math.atan2(dx,dz),dt*12);
      stepT-=dt;if(stepT<=0){stepSound();stepT=0.32}
    }
  }
  const ty=me.sitting?me.sitting.y-0.35:gh(me.x,me.z);me.y+=(ty-me.y)*Math.min(1,dt*14);
  if(me.act){me.actT+=dt;if(me.actT>(ACT_DUR[me.act]||1.5)){me.act=null}}
  if(npc.act){npc.actT+=dt;if(npc.actT>1.6)npc.act=null}
  const inH=me.x>-19.4&&me.x<19.4&&me.z>-45.4&&me.z<-18.6&&me.y>1.5;
  if(inH!==me.inHall){
    me.inHall=inH;hallRoof.visible=!inH;
    if(inH&&gameOn){const had=save.stamps.includes('hall');stamp('hall');setTimeout(()=>say(role().hall,'정전',7000),had?0:1900)}
  }
  const zn=inH?'hall':(me.z<-52?'pond':'yard');
  if(zn!==curZone){curZone=zn;if(gameOn){if(zn!=='hall')stamp(zn);$('#hint').textContent='지금 있는 곳: '+ZONES.find(z=>z.id===zn).n}}
  // 인물
  const jumpY=me.act==='jump'?Math.sin(Math.min(1,me.actT/1.0)*Math.PI)*4.2:0;
  playerFig.position.set(me.x,me.y+jumpY,me.z);playerFig.rotation.y=me.face;
  poseFig(playerFig,{moving:me.moving,phase:me.phase,act:me.act,actT:me.actT,sit:!!me.sitting});
  npcFig.rotation.y=turn(npcFig.rotation.y,Math.atan2(me.x-npc.x,me.z-npc.z),dt*4);
  poseFig(npcFig,{act:npc.act,actT:npc.actT});
  ladies.forEach(l=>poseFig(l,{}));
  ministers.forEach(m=>{
    const tgt=(Math.min(me.inHall?me.z:1e9,mpHallMinZ())<m.z+6)?0.85:0;m.bow+=(tgt-m.bow)*Math.min(1,dt*3);
    poseFig(m.fig,{bow:m.bow});
  });
  // 새, 물, 소원 등불
  birdT-=dt;
  if(birdT<=0){birdT=3+Math.random()*5;if(night<0.5&&gameOn)chirp()}
  BIRDS.forEach((b,i)=>{
    b.a+=b.sp*dt;b.g.visible=night<0.6;
    b.g.position.set(Math.cos(b.a)*b.r,b.h+Math.sin(time+i)*1.2,b.cz+Math.sin(b.a)*b.r*0.6);
    b.g.rotation.y=-b.a;const f=Math.sin(time*9+i)*0.6;b.pl.rotation.z=f;b.pr.rotation.z=-f;
  });
  WATERS.forEach(t=>{t.offset.x+=dt*0.012;t.offset.y+=dt*0.007});
  WISH3D.forEach(w=>{const p=wishPos(w.w,w.born);w.g.position.set(p.x,p.y,p.z)});
  mpUpdate(dt);
  // 카메라와 그림자
  updateCamera(dt);
  sun.position.set(me.x+45,80,me.z+30);sun.target.position.set(me.x,0,me.z);
}
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  update(dt);renderer.render(scene,camera);requestAnimationFrame(frame);
}
function resize(){
  const w=stage.clientWidth||window.innerWidth,h=stage.clientHeight||window.innerHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);

/* ========== 화면 버튼, 역할 뽑기 ========== */
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>doAction(b.dataset.act)));
$('#wishForm').addEventListener('submit',e=>{
  e.preventDefault();
  const t=$('#wishInput').value.trim();if(!t)return;
  let x=0,z=-78;for(let i=0;i<30;i++){x=-50+Math.random()*100;z=-94+Math.random()*32;if((x/58)**2+((z+78)/18)**2<0.7)break}
  const w={t:t.slice(0,16),x,z,s:Math.random()*6};
  save.wishes.push(w);save.wishes=save.wishes.slice(-12);persist();addWish(w,true);
  $('#wishInput').value='';$('#wishForm').hidden=true;
  say('등불이 연못 위로 떠오릅니다. 소원: '+w.t,'소원 등불');stamp('wish');
});
$('#dnBtn').addEventListener('click',()=>{
  nightTarget=nightTarget?0:1;
  const b=$('#dnBtn');b.textContent=nightTarget?'낮으로':'밤으로';b.setAttribute('aria-pressed',nightTarget?'true':'false');
});
$('#sndBtn').addEventListener('click',()=>{
  sndOn=!sndOn;initAudio();if(master)master.gain.value=sndOn?0.9:0;
  const b=$('#sndBtn');b.textContent=sndOn?'소리 켬':'소리 끔';b.setAttribute('aria-pressed',sndOn?'true':'false');
});
$('#viewBtn').addEventListener('click',()=>{
  cam3.ov=!cam3.ov;
  if(cam3.ov){cam3.prev={d:cam3.distT,p:cam3.pitchT};cam3.distT=135;cam3.pitchT=1.0}
  else{const p=cam3.prev||{d:15,p:0.42};cam3.distT=p.d;cam3.pitchT=p.p}
  $('#viewBtn').textContent=cam3.ov?'돌아가기':'전체 보기';
});
$('#bookBtn').addEventListener('click',()=>{$('#book').hidden=false});
$('#bookClose').addEventListener('click',()=>{$('#book').hidden=true});
$('#roleChip').addEventListener('click',()=>{if(gameOn){gameOn=false;$('#intro').hidden=false;syncIntro()}});

let drawing=false;
function syncIntro(){
  const has=!!save.role;
  $('#slotName').textContent=has?ROLES[save.role].n:'황후? 황제? 협객?';
  $('#slotDesc').textContent=has?ROLES[save.role].d:'';
  $('#enterBtn').hidden=!has;
  $('#drawBtn').textContent=has?'다시 뽑기':'오늘의 역할 뽑기';
  $('#drawBtn').className=has?'btn':'btn primary';$('#enterBtn').className=has?'btn primary':'btn';
  $('#visitInfo').textContent='방문 '+save.days.length+'일째 · 같은 시각에 접속한 사람끼리 서로 보이고 손을 흔들 수 있어요.';
}
$('#drawBtn').addEventListener('click',()=>{
  if(drawing)return;drawing=true;initAudio();
  const keys=Object.keys(ROLES);let n=0;$('#slotDesc').textContent='';$('#enterBtn').hidden=true;
  const iv=setInterval(()=>{
    $('#slotName').textContent=ROLES[pick(keys)].n;
    if(++n>14){clearInterval(iv);save.role=pick(keys);persist();drawing=false;syncIntro();chime()}
  },reduce?1:85);
});
function applyRole(){
  const r=role();
  $('#roleChip').textContent='오늘의 나 · '+r.n;$('#bowBtn').textContent=r.bowLabel;$('#roleActBtn').textContent=r.actLabel;
  rebuildCast();
}
$('#enterBtn').addEventListener('click',()=>{
  if(drawing)return;
  initAudio();applyRole();renderBook();
  standUp();me.x=0;me.z=70;me.y=0;me.face=Math.PI;me.path=[];me.pending=null;me.act=null;
  save.nick=($('#nickInput').value||'').trim().slice(0,10)||save.nick||('손님'+Math.floor(10+Math.random()*90));persist();
  gameOn=true;$('#intro').hidden=true;curZone='';
  say('오늘의 나는 '+role().n+'입니다. 바닥을 누르면 걸어가요. 드래그로 시점을 돌려보세요.','입장',6000);
});

/* ========== 시작 ========== */
$('#nickInput').value=save.nick||'';
resize();renderBook();syncIntro();applyRole();applyLighting(night);initMP();
requestAnimationFrame(frame);

</script></body></html>
